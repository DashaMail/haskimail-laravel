name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }} · ${{ matrix.stability }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['11', '12', '13']
        stability: [prefer-stable]
        exclude:
          - { php: '8.2', laravel: '13' }
          - { php: '8.5', laravel: '11' }
        include:
          - { php: '8.2', laravel: '11', stability: prefer-lowest }

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, json
          coverage: pcov

      - name: Select Laravel ${{ matrix.laravel }}
        run: |
          case "${{ matrix.laravel }}" in
            11) TESTBENCH='^9.9' ;;
            12) TESTBENCH='^10.0' ;;
            13) TESTBENCH='^11.0' ;;
          esac
          # Static analysis runs in the "quality" job; keep the test install minimal.
          composer remove --dev larastan/larastan laravel/pint --no-update --no-interaction
          composer require --dev "laravel/framework:^${{ matrix.laravel }}.0" "orchestra/testbench:${TESTBENCH}" --no-update --no-interaction

      - name: Install dependencies
        run: composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress

      - name: Tests
        run: vendor/bin/phpunit --coverage-text

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none

      - run: composer validate --strict
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --memory-limit=1G
      - run: composer audit
